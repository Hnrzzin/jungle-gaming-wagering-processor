services:
  postgres:
    image: postgres:16 
    container_name: wagering-postgres
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ministack:
    image: ministackorg/ministack:1.3.18
    container_name: wagering-ministack
    ports:
      - "4566:4566"

volumes:
  pgdata: